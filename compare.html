.go{align-self:flex-start;display:inline-block;background:var(--br);color:#fff;text-decoration:none;font-weight:700;border-radius:99px;padding:5px 14px;font-size:12px}
.go:hover{filter:brightness(1.1)}
.d text{font-family:inherit;font-size:10px;font-weight:700;fill:var(--ink2);text-anchor:middle}

.d .cwl{fill:none;stroke:var(--teal);stroke-width:2.4}.d .ld{fill:none;stroke:var(--mut);stroke-width:.8}

table.ct{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.ct th,.ct td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.ct thead th{font-size:12px;color:var(--ink2);background:var(--paper);position:sticky;top:0}
.ct thead th em{font-style:normal;font-weight:900;color:var(--br);margin-right:4px}
.ct tbody th{width:15%;font-weight:900;color:var(--ink2);font-size:12px}
.ct td{width:28.3%}.ct td small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.ct tr:last-child>*{border-bottom:0}
.lv{display:inline-block;font-size:10.5px;font-weight:900;border-radius:6px;padding:0 6px;margin-right:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink2)}
.num{font-variant-numeric:tabular-nums;font-weight:900;color:var(--ink2);font-size:13.5px}
.cond{font-size:11.5px;color:var(--ink);background:var(--paper);border-radius:10px;padding:8px 12px;margin-top:8px}
.cond b{color:var(--ink2)}
.no{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:6px}
.no div{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 12px;font-size:12px}
.no b{display:block;color:var(--ink2);font-size:12.5px}.no span{display:block;margin-top:3px;font-weight:700;color:#b8770f;font-size:11.5px}
.fit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.fit div{border:1px solid var(--line);border-top:3px solid var(--br);border-radius:10px;background:var(--card);padding:8px 12px;font-size:12px}
.fit b{display:block;color:var(--ink2);font-size:13px;margin-bottom:2px}
.fnote{font-size:11px;color:var(--mut);margin-top:8px}
@media(max-width:900px){.arch,.fit{grid-template-columns:1fr}.okmain{padding:4px 8px 12px}}
@media(max-width:700px){
 table.ct,.ct tbody,.ct tr,.ct th,.ct td{display:block;width:auto}
 .ct thead{display:none}
 .ct tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card)}
 .ct tbody th{width:auto;background:var(--paper);border-radius:10px 10px 0 0}
 .ct td::before{content:attr(data-h);display:block;font-size:10.5px;font-weight:900;color:var(--br);letter-spacing:.04em}
 .ct tr>*{border-bottom:1px solid var(--line)}.ct tr>*:last-child{border-bottom:0}

  /* ---------- 量化（B 區）：只呼叫既有純函式，不新增公式 ----------
     NPO：npoElec(L, 'solder')（§3.14，53 GHz）；CPO：npoElec.K.ref.cpo（= CPO 課 §3.1b 在 53 GHz 的係數：1.0 dB + 0.199 dB/mm）；
     可插拔：plugElec(L, plugElec.K.fRef = 53.125 GHz)（§3.15）。範圍＝各課滑桿範圍；代表長度＝各課預設。 */
  function quant() {
    var ne = K.npoElec, pe = K.plugElec;
    if (!ne || !pe || !ne.K || !pe.K) return null;
    var NK = ne.K, PK = pe.K, c = NK.ref.cpo, v = NK.v,
        cpoIL = function (L) { return c.IF + c.a * L; };
    return {
      pluggable: { r: [PK.Lmin, PK.Ldef, PK.Lmax], il: pe(PK.Ldef, PK.fRef).il, lo: pe(PK.Lmin, PK.fRef).il, hi: pe(PK.Lmax, PK.fRef).il, lat: PK.v * PK.Ldef, own: pe(PK.Ldef).il },
      npo: { r: [NK.Lmin, NK.Ldef, NK.Lmax], il: ne(NK.Ldef, 'solder').il, lo: ne(NK.Lmin, 'solder').il, hi: ne(NK.Lmax, 'solder').il, lat: v * NK.Ldef },
      cpo: { r: [2, c.L, 30], il: cpoIL(c.L), lo: cpoIL(2), hi: cpoIL(30), lat: v * c.L }   /* 2–30 mm＝CPO 課滑桿範圍（§3.1b） */
    };
  }

  function T(x, y, s, cl) { return '<text x="' + x + '" y="' + y + '"' + (cl ? ' class="' + cl + '"' : '') + '>' + s + '</text>'; }
  function R(x, y, w, h, cl, rx) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 1.5) + '" class="' + cl + '"/>'; }
  function P(d, cl) { return '<path d="' + d + '" class="' + cl + '"/>'; }
  function svgOf(id, s) {

    } else {

        P('M102,140 H116', 'el') + P('M170,140 H184', 'el') + T(150, 202, s.ptrace, 'tE') + P('M177,194 V142', 'ld') +
        R(226, 130, 9, 16, 'opt') + T(252, 135, s.fau, 'm s') +
        R(296, 76, 38, 18, 'opt') + T(315, 70, s.els, 'tO') +
        P('M296,86 C262,86 248,100 232,130', 'cwl') + P('M235,140 C280,140 300,146 334,146', 'md') + T(290, 156, s.fibers, 'm s') + P('M341,146 H360', 'md');

  function f1(x) { return (+x).toFixed(1); }
  function fill(s, o) { return s.replace(/\{(\w+)\}/g, function (m, k) { return o[k] != null ? o[k] : m; }); }

  function render(l) {
    lang = l; var d = D[l], zh = l === 'zh', q = quant(), $ = function (s) { return document.querySelector(s); };
    document.title = d.title; $('#sb').textContent = d.sub; $('#bd').textContent = d.bd;
    if (K.markLang) K.markLang(l);
    var href = function (id) { return PATH[id] + '?lang=' + l; };
    var h = '';
    /* 導言 */
    h += '<section class="cbox lead"><div class="eyb">' + d.eyb + '</div><h2>' + d.h + '</h2><p>' + d.lead + '</p><div class="key">' + d.key + '</div>' +
      '<div class="tags"><span class="m" style="font-size:11.5px;color:var(--mut)">' + d.tagT + '</span>' +
      d.tags.map(function (t, i) { return '<span class="tg3 ' + 'abc'.charAt(i) + '">' + t + '</span>'; }).join('') + '</div></section>';
    /* 三張布局圖 */
    h += '<section class="cbox"><div class="arch">' + C3.map(function (id, i) {
      return '<div class="ac" data-arch="' + id + '"><div class="hd"><em>' + (i + 1) + '</em><b>' + d.n[id] + '</b></div><div class="rep">' + d.rep[id] + '</div>' +
        svgOf(id, d.svg) + '<ul>' + d.bul[id].map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul>' +
        '<a class="go" data-go="' + id + '" href="' + href(id) + '">' + d.go + '</a></div>';
    }).join('') + '</div><div class="lgd"><span><i></i>' + d.lg[0] + '</span><span><i class="m"></i>' + d.lg[1] + '</span><span><i class="c"></i>' + d.lg[2] + '</span><span><i class="ba"></i>' + d.lg[3] + '</span><span><i class="bo"></i>' + d.lg[4] + '</span><span>' + d.lgN + '</span></div></section>';
    /* 表格產生器：rows = [[列名, 可插拔, NPO, CPO]] */
    var head = '<thead><tr><th></th>' + C3.map(function (id, i) { return '<th><em>' + (i + 1) + '</em>' + d.n[id] + '</th>'; }).join('') + '</tr></thead>';
    var tbl = function (rows, idA) {
      return '<div class="tw"><table class="ct" id="' + idA + '">' + head + '<tbody>' + rows.map(function (r) {
        return '<tr><th scope="row">' + r[0] + '</th>' + [1, 2, 3].map(function (k) { return '<td data-h="' + (k) + ' · ' + d.n[C3[k - 1]] + '">' + r[k] + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
    };
    h += '<section class="cbox"><h3>' + d.t1 + '</h3><p class="fnote" style="margin-top:0">' + d.t1s + '</p>' + tbl(d.rows1, 'tA') + '</section>';
    h += '<section class="cbox"><h3>' + d.t2 + '</h3><p class="fnote" style="margin-top:0">' + d.t2s + '</p>' + tbl(d.rows2, 'tT') + '</section>';
    /* B 區：統一條件的量化 */
    var qr;
    if (q) {
      var mm = function (a) { return a[0] + '–' + a[2] + ' mm'; };
      var lat = function (ps) { return ps >= 1000 ? f1(ps / 1000) + ' ns' : Math.round(ps) + ' ps'; };
      qr = [
        [d.rows3[0]].concat(C3.map(function (id) { return mm(q[id].r); })),
        [d.rows3[1]].concat(C3.map(function (id) { return q[id].r[1] + ' mm'; })),
        [d.rows3[2]].concat(C3.map(function (id) { return '<span class="num" data-il="' + id + '">' + f1(q[id].il) + ' dB</span>'; })),
        [d.rows3[3]].concat(C3.map(function (id) { return f1(q[id].lo) + '–' + f1(q[id].hi) + ' dB'; })),
        [d.rows3[4]].concat(C3.map(function (id) { return lat(q[id].lat); }))
      ];
    } else qr = d.rows3.map(function (r) { return [r, d.na, d.na, d.na]; });
    h += '<section class="cbox"><h3>' + d.t3 + '</h3><p class="fnote" style="margin-top:0">' + d.t3s + '</p>' + tbl(qr, 'tQ') +
      '<div class="cond">' + d.cond + '</div>' +
      (q ? '<p class="fnote">' + fill(d.plugN, { a: f1(q.pluggable.own), b: f1(q.pluggable.il) }) + '</p>' : '') +

    /* 適合解決的問題 */

      return '<div><b>' + (i + 1) + ' · ' + x[0] + '</b>' + x[1] + '<p style="margin:8px 0 0"><a class="go" href="' + href(C3[i]) + '">' + d.go + '</a></p></div>';
    }).join('') + '</div><p class="fnote">' + d.fnote + '</p></section>';
    $('#cw').innerHTML = h;
    if (K.courseNav) K.courseNav($('#course'), 'compare', l, '');

  if (K.bindLang) K.bindLang(render);

})();
