<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHIP PACKAGING 入門 · CPO 互動 3D 教材</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="core/core.css">
<style>
/* 色票、字體、標題列、語言切換、底部課程選單已移至 core/core.css（三門課共用）；以下為 CPO 3D 課程專用版面 */
#app{height:100%;display:grid;grid-template-columns:auto minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"h h h" "s v p" "b b b"}
#side{grid-area:s;width:250px;margin-left:12px;background:var(--sf);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:width .22s}
#side.c{width:44px}#side.c .sl,#side.c #st1,#side.c #ov,#side.c .sh2{display:none}#side.c .sh{justify-content:center;padding:12px 0}#side.c .tg{transform:rotate(180deg)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px 14px;font-weight:900;color:var(--ink2)}
.tg{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--br);cursor:pointer;font-weight:900;line-height:1}
.sl{overflow:auto;padding:0 8px 8px;flex:1 1 0;min-height:120px}
/* M5.5：左側 = 概覽（所選元件＋課程簡介）→ 訊號流程（可收合）→ 元件清單（獨立捲動）。概覽區最多占 55% 高度，超過時自己捲動 */
#ov{flex:0 1 auto;max-height:55%;overflow:auto;padding:0 8px 6px;border-bottom:1px solid var(--line)}
.sh2{font-size:12px;font-weight:900;color:var(--ink2);padding:8px 14px 2px}
.ovc{padding:9px 10px}.ovc .ch b{font-size:14px}
.dsc{font-size:12px;margin:5px 0 4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.dsc.full{display:block}
.dmo{border:0;background:none;color:var(--br);font-size:11px;font-weight:700;cursor:pointer;padding:0}
.ovc .met{padding:3px 8px;margin-top:3px;font-size:11px}.ovc .met b{font-size:11px}
#ov .xp{margin:6px 0;padding:0 8px 6px}#ov .xp summary{font-size:12px;padding:7px 0 3px}#ov .note{margin:4px 0 2px;font-size:12px}
.sgb{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:7px 9px;margin:6px 0 2px}
.sgh{display:flex;align-items:center;justify-content:space-between;gap:6px}.sgh b{color:var(--ink2);font-size:12.5px;min-width:0}.sgh .pwb{padding:3px 11px;font-size:12px;white-space:nowrap;flex:none}
#rst{display:block;font-size:11px;margin:4px 0 0;line-height:1.4}
.sgb .xp{margin:6px 0 0;background:var(--sf)}.sgb .stl .st{font-size:12px;padding:4px 8px}.sgb .rw{font-size:11px}.sgb .bits i{height:22px}.sgb .lgd{font-size:10.5px}
.gh{font-size:11px;letter-spacing:.1em;color:var(--mut);font-weight:700;padding:10px 6px 4px}
.it{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;cursor:pointer}.it:hover{background:var(--paper)}.it.on{background:var(--br);color:#fff}
.it .n{flex:1;min-width:0}.it b{display:block;font-size:13px}.it small{display:block;font-size:10.5px;opacity:.7}
.eye{border:0;background:none;color:inherit;opacity:.65;cursor:pointer;padding:3px;display:grid}
#vp{grid-area:v;position:relative;margin:0 12px;border-radius:14px;overflow:hidden;min-height:0}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#labs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font-size:10px;line-height:14px;padding:0 6px 0 5px;border-radius:7px;background:var(--sf);opacity:.93;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.lb::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--teal);margin-right:4px;vertical-align:1px}
.lb.on{background:var(--br);color:#fff;border-color:var(--br);opacity:1}
.pill{position:absolute;left:12px;top:12px;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;color:var(--ink2);max-width:60%}
.chip{position:absolute;left:12px;top:50px;font-size:11.5px;background:var(--sf);border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--ink2)}
.chip::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:6px}
.hint{position:absolute;right:12px;top:14px;font-size:11px;color:var(--mut)}
/* M5.5：3D 左下 = 「分離圖層」與「抬升所選層」兩個小滑桿水平並排；3D 寬度不足（#vp.nar）時改為橫跨底部，工具列移到其上方 */
#ex{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:2}
#ex .sx{width:150px;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:5px 10px 2px;font-size:11px}
#ex .sx div{display:flex;justify-content:space-between;gap:6px;color:var(--mut);font-weight:700;white-space:nowrap}#ex .sx span{overflow:hidden;text-overflow:ellipsis}#ex b{color:var(--acc)}
#ex .sx.dis{opacity:.6}#ex .sx.dis b{color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0}
#tb{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:2}
#tb>div{display:flex;gap:6px}#tb .tr{order:-1}
#vp.nar #ex{right:12px}#vp.nar .hint{display:none}#vp.nar #ex .sx{flex:1;width:auto;min-width:0}#vp.nar #tb{bottom:var(--exh,64px)}
/* M5.5：剖面／規格參考卡（非模態、小型、可捲動；與原理圖互斥，同時只開一個） */
#ref{position:absolute;right:12px;bottom:var(--bb,90px);z-index:3;width:min(340px,calc(100% - 24px));max-height:min(440px,calc(100% - var(--bb,90px) - 56px));overflow:auto;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:8px 12px 10px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
#ref[hidden]{display:none}#ref .shd{position:sticky;top:-8px;background:var(--sf);padding:4px 0;z-index:1}#ref .note{margin:8px 2px 0;font-size:11.5px}#ref .sg{margin:10px 0 5px}
#tb button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--sf);color:var(--br);cursor:pointer;display:grid;place-items:center;font-size:15px;font-weight:700;padding:0}
#tb .on{background:var(--br);color:#fff}
#panel{grid-area:p;margin-right:12px;background:var(--sf);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#pb{overflow:auto;padding:4px 14px 14px;flex:1 1 0;min-height:140px}
/* M5.5：右側上半 = 固定可見的五項鏈路效能看板（#dash），下半 = 三組控制（#gtab 切換、#pb 捲動）。捲動 #pb 時看板不動 */
#dash{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;padding:10px 12px 8px;border-bottom:1px solid var(--line);background:var(--sf)}#dash>*{flex:none}
.dh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.dh b{font-size:13px;font-weight:900;color:var(--ink2)}.dh i{font-style:normal;font-size:10px;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.d5{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.dt{position:relative;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 26px 5px 9px;min-width:0;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.dt:hover{border-color:var(--br)}.dt.on{border-color:var(--br);box-shadow:inset 0 0 0 1px var(--br)}.dt.w2{grid-column:1 / -1}
.dt small{display:block;font-size:10.5px;font-weight:900;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt b{display:block;font:900 16px/1.25 ui-monospace,Menlo,monospace;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt .ds{display:block;font-size:10px;color:var(--mut);line-height:1.35}
.dt em{position:absolute;right:6px;top:5px;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);font:700 10px/14px serif;font-style:italic;text-align:center;color:var(--br);background:var(--sf)}
.dt.on em{background:var(--br);color:#fff;border-color:var(--br)}
.dbar{display:block;height:4px;border-radius:2px;background:var(--track);margin-top:4px;overflow:hidden}.dbar i{display:block;height:100%;background:var(--br);transition:width .25s}
.dbar i.q-good{background:#2e9d6a}.dbar i.q-warn{background:#d08a1a}.dbar i.q-bad{background:#d9534f}
.dt b.chg{animation:chg .6s ease-out}@keyframes chg{from{color:var(--acc)}}
#dst{font-size:10.5px;color:var(--mut);margin:5px 0 0;line-height:1.4}
#dx{margin-top:7px;border:1px solid var(--br);border-radius:12px;background:var(--card);max-height:min(42vh,340px);overflow:auto;padding:0 10px 8px}#dash>#dx{flex:0 1 auto;min-height:90px}
#dx[hidden]{display:none}#dx .shd{position:sticky;top:0;background:var(--card);padding:6px 0 4px;z-index:1}#dx .shd b{font-size:13px}
.gtab{margin:8px 12px 6px}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px;margin:6px 0;table-layout:fixed}
.cmp th,.cmp td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--mut);font-weight:700;width:31%}
.cmp td{font:700 11px ui-monospace,Menlo,monospace;color:var(--ink2)}.cmp td small{display:block;font:400 10px inherit;color:var(--mut)}
.cmp thead th{font-weight:900;color:var(--ink2)}.cmp thead th button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:2px 6px;cursor:pointer;font-weight:900;color:var(--ink2);width:100%}
.cmp thead th small{display:block;font-size:9.5px;font-weight:700;color:var(--mut);margin-top:2px}
.cmp .on{background:var(--track)}.cmp thead th.on button{background:var(--br);border-color:var(--br);color:#fff}.cmp tr:last-child td{border-bottom:0}
.card{border:1px solid var(--line);border-left:4px solid var(--br);border-radius:12px;padding:12px;background:var(--card)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.ch b{font-size:15px;color:var(--ink2)}.ch i{font-style:normal;font-size:11px;font-weight:700;color:var(--mut)}
.card p{margin:6px 0 8px}
.met{display:flex;justify-content:space-between;gap:10px;background:var(--paper);border-radius:8px;padding:5px 10px;margin-top:5px;font-size:12px}
.met span{color:var(--mut);font-weight:700}.met b{color:var(--ink2);font:700 12px ui-monospace,Menlo,monospace;text-align:right}
.met.lf{background:none;padding:8px 0 0;border-top:1px solid var(--line);margin-top:9px}.met.lf b{color:var(--br)}
.note{font-size:12.5px;color:var(--ink);margin:12px 2px 0}
.sg{font-size:10.5px;letter-spacing:.14em;font-weight:900;color:var(--mut);margin:14px 0 6px}
.tbl{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:2px 12px}
.tbl div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}.tbl div:last-child{border:0}
.tbl span{color:var(--mut)}.tbl b{font:700 12px ui-monospace,Menlo,monospace;color:var(--ink2);text-align:right}
.xs{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px}.xs g{cursor:pointer}.xs g:hover{opacity:.8}.xs .sel>*{stroke:var(--acc);stroke-width:1.6}.xs text{fill:#fff;font:700 10px sans-serif;text-anchor:middle;pointer-events:none}
.h2{font-weight:900;color:var(--ink2);margin:2px 0 8px}
.pwb{border:1px solid var(--line);background:var(--paper);color:var(--mut);border-radius:99px;padding:5px 16px;font-weight:700;cursor:pointer}.pwb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rw{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin:9px 0 3px}
.bits{display:flex;gap:4px}.bits i{flex:1;height:26px;border-radius:5px;background:var(--track);display:grid;place-items:center;font:700 11px ui-monospace,monospace;font-style:normal;color:var(--mut)}
.bits.in i{cursor:pointer}.bits .h{background:var(--acc);color:#fff}.bits.lt .h{background:var(--mod);color:#fff}.bits.lt .l{background:var(--track);color:var(--mod)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
/* M4-A：訊號流原理圖浮層、運行狀態。三種訊號外觀：電＝橘（--acc，方塊）、連續光＝青（--teal，實線）、調變光＝紫（--mod，亮暗虛線） */
:root{--mod:#7c4dff}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--mod:#b79bff}}:root[data-theme=dark]{--mod:#b79bff}
#tb .wide{width:auto;padding:0 12px 0 10px;border-radius:99px;gap:5px;display:flex;font-size:12px}
#runb{position:absolute;left:12px;top:80px;font-size:11.5px;font-weight:700;background:var(--sf);border:1px solid var(--acc);border-radius:99px;padding:1px 10px;color:var(--ink2);max-width:70%}
#runb::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px;animation:blink 1s infinite alternate}
@keyframes blink{to{opacity:.25}}
#sch{position:absolute;left:12px;right:12px;bottom:var(--bb,90px);z-index:3;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:8px 12px 10px;box-shadow:0 6px 24px rgba(0,0,0,.14);max-height:calc(100% - var(--bb,90px) - 80px);overflow:auto}
#sch[hidden],#runb[hidden]{display:none}
.shd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.shd b{color:var(--ink2);font-size:14px}.shd .tag{font-size:10.5px;color:var(--mut);font-weight:700}.shd .sp{flex:1}
.shd .x{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--br);cursor:pointer;font-weight:900;padding:0}
.sv{width:100%;height:auto;max-height:250px;display:block;margin:4px 0}
.sv text{font-family:inherit;text-anchor:middle;fill:var(--ink2);pointer-events:none}
.sv .t1{font-size:10.5px;font-weight:900}.sv .t2{font-size:8.5px;fill:var(--mut)}.sv .lt{font-size:9px;font-weight:700;fill:var(--mut)}.sv .bl{text-anchor:start;font-size:9.5px;font-weight:900;letter-spacing:.05em}.sv .st{text-anchor:start}
.sv .bd{fill:none;stroke-width:1.2;stroke-dasharray:5 4}.sv .bd.p{stroke:var(--br)}.sv .bd.r{stroke:var(--teal)}
.sn{cursor:pointer}.sn rect{fill:var(--card);stroke-width:1.6}.sn.e rect{stroke:var(--acc)}.sn.o rect{stroke:var(--teal)}.sn.x rect{stroke:var(--mod)}.sn:hover rect{fill:var(--paper)}
.lk{fill:none;stroke-width:2.4;cursor:pointer}.lk.e{stroke:var(--acc)}.lk.c{stroke:var(--teal);stroke-width:5;stroke-opacity:.8}.lk.m{stroke:var(--mod);stroke-width:3.4;stroke-dasharray:9 5}
.ah-e{fill:var(--acc)}.ah-c{fill:var(--teal)}.ah-m{fill:var(--mod)}
.wv{fill:none;stroke-width:1.5}.wv.e{stroke:var(--acc)}.wv.c{stroke:var(--teal);stroke-width:3}.wv.m rect{fill:var(--mod);stroke:none}
#sch:not(.run) .wv{opacity:.3}
.run .sn,.run .lk,.run .wv{transition:opacity .3s}
.run .sn:not(.act):not(.done):not(.always),.run .lk:not(.act):not(.done):not(.always),.run .wv:not(.act):not(.done):not(.always){opacity:.3}
.sn.act rect{stroke-width:3.4;fill:var(--track);animation:pz .8s ease-in-out infinite alternate}.sn.done rect{stroke-width:2.4}.sn.pv rect{stroke-width:3;fill:var(--track)}
@keyframes pz{to{stroke-opacity:.35}}
.run .lk.act{stroke-width:4;stroke-dasharray:8 5;animation:flow .5s linear infinite}.run .lk.c.always{stroke-dasharray:none;animation:none}.run .lk.c.act{stroke-width:6}
@keyframes flow{to{stroke-dashoffset:-13}}
.sci{font-size:12px;color:var(--ink);background:var(--paper);border-radius:8px;padding:6px 10px}
.rs{display:inline-block;font-weight:900;color:var(--mut);margin-right:8px}.rs.on{color:var(--acc)}
.lgd{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;color:var(--ink);margin:6px 0}
.lgd i{display:inline-block;vertical-align:middle;margin-right:5px}.ke{width:9px;height:9px;background:var(--acc)}.kc{width:18px;height:5px;border-radius:3px;background:var(--teal)}.km{width:18px;height:4px;background:repeating-linear-gradient(90deg,var(--mod) 0 6px,transparent 6px 9px)}
.scv{font-size:11px;color:var(--mut);margin:6px 0 0}
.rr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stl{display:grid;gap:4px;margin:8px 0}
.stl .st{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.stl em{font-style:normal;font-weight:900;color:var(--mut);min-width:1em}.stl b{color:var(--ink2)}.stl u{text-decoration:none;font-size:10px;color:var(--teal);border:1px solid var(--teal);border-radius:99px;padding:0 5px;margin-left:4px;font-weight:700}
.stl small{display:none;font-size:12px;color:var(--ink);margin-top:2px;line-height:1.5}.stl .act small,.stl .pv small{display:block}
@media(max-width:600px){#sch{max-height:calc(100% - var(--bb,90px) - 60px);padding:6px 8px}#sch .shd .tag,#sch .lgd,#sch .scv{display:none}.sci{font-size:11.5px}}
.stl .act{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc);background:var(--card)}.stl .act em{color:var(--acc)}.stl .done em{color:var(--acc)}.stl .pv{border-color:var(--br)}
/* M4-B：光學實驗（子分頁、摺疊區塊、即時圖、功率瀑布） */
.seg{display:flex;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:3px;margin:10px 0 6px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:5px 2px;font-weight:700;font-size:12px;color:var(--mut);cursor:pointer}.seg .on{background:var(--br);color:#fff}
.xp{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0;padding:0 10px 8px}
.xp summary{cursor:pointer;font-weight:900;color:var(--ink2);padding:9px 0 4px;display:flex;align-items:baseline;gap:6px;list-style:none;font-size:13px}
.xp summary::-webkit-details-marker{display:none}.xp summary::before{content:'▸';color:var(--br)}.xp[open] summary::before{content:'▾'}
.xp summary .sp{flex:1}.xp summary em{font:700 11px ui-monospace,monospace;font-style:normal;color:var(--mut);white-space:nowrap}
.xv{width:100%;display:block;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin:6px 0}
.xv text{font-family:inherit;font-size:9px;fill:var(--mut)}.xv .tk{font-weight:700;fill:var(--ink2)}
label.rw b{float:right;font:700 11.5px ui-monospace,monospace;color:var(--ink2)}
input[type=range]:disabled{opacity:.4}
.cps{display:grid;gap:4px;margin:4px 0}.cps button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:4px 9px;cursor:pointer;color:var(--ink);font-size:12px}
.cps button b{display:block;color:var(--ink2)}.cps button small{color:var(--mut);font-size:10.5px}.cps .on{border-color:var(--br);box-shadow:inset 3px 0 0 var(--br);background:var(--card)}
.xrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 2px}.xrow .pwb{padding:4px 12px;font-size:12px}
.xs2{font-size:11.5px;color:var(--mut);margin:6px 0 0;line-height:1.55}
.xmsg{font-size:11.5px;font-weight:700;color:var(--ink2)}
.wf{display:grid;gap:3px;margin:6px 0}.wf div{display:grid;grid-template-columns:minmax(0,1fr) 64px 50px;gap:6px;align-items:center;font-size:11.5px}
.wf span{color:var(--mut)}.wf i{display:block;height:8px;border-radius:4px;background:var(--br);min-width:2px}.wf i.hot{background:#d9534f}.wf b{font:700 11px ui-monospace,monospace;color:var(--ink2);text-align:right}

{i:'interposer',g:0,z:'電氣中介層',e:'Electrical Interposer',dz:'矽中介層以微凸塊連接運算晶片與光學引擎，細線寬 RDL 與 TSV 在毫米內重新分配高速訊號，是 CPO 電氣路徑縮短的關鍵。',de:'The silicon interposer joins the ASIC and optical engines through microbumps; fine RDL traces and TSVs reroute high-speed signals within millimeters.',m:[['材料','Material','Si + Cu TSV'],['TSV 孔徑','TSV diameter','≈ 5–12 µm'],['走線','Routing','RDL（µm 級）']]},

{i:'c4',g:0,z:'C4 覆晶凸塊',e:'C4 Bump',dz:'中介層與基板之間較粗的覆晶凸塊（C4），間距約 150–200 µm；它和微凸塊、BGA 焊球、TSV 是四種不同的東西。',de:'Coarser flip-chip C4 bumps join interposer to substrate at ≈ 150–200 µm pitch — distinct from microbumps, BGA balls and TSVs.',m:[['間距','Pitch','≈ 150–200 µm'],['位置','Location','中介層 ↔ 基板'],['焊料','Solder','無鉛 Pb-free']]},

st:[['ASIC sends data','The switch ASIC’s SerDes sends 0/1 data as an electrical signal over a short in-package interconnect (RDL / µBump; length L set by the distance slider below) to the optical engine. The ASIC only handles electrical signals — it does not emit light.'],
['EIC driver','The EIC (electronic IC) on the optical engine receives the data and amplifies it into a drive-voltage swing strong enough to push the modulator, passing through the 3D stack to the MRM on the PIC (photonic IC) below.'],
['MRM modulates','The external laser (ELS) continuously feeds data-free continuous-wave (CW) light through a waveguide to the microring modulator (MRM). The drive voltage shifts the ring’s resonance, making the passing light brighter or dimmer — the data is “written” onto the light. The laser only supplies light; the MRM does the modulation.'],
['FAU → fiber','The modulated light follows a waveguide to the fiber array unit (FAU), couples into single-mode fiber, and leaves through the front-panel connector toward the far-end device.'],
['Far-end Ge PD','(Far-end receiver) A germanium photodetector at the other end of the fiber absorbs the light: bright light makes a larger photocurrent, dim light a smaller one.'],
['Far-end TIA','(Far-end receiver) A transimpedance amplifier (TIA) turns the tiny photocurrent into a voltage, recovering the 0/1 data as an electrical signal for the receiving chip.']],

n:'高斯模場重疊近似（B 級公式）：η = 4 / [(w₁/w₂ + w₂/w₁)² + (λz / πn·w₁w₂)²] × exp[−2(x²+y²) / (w₁² + w₂(z)²)]，w₂(z) 為光纖光束經間隙 z 擴張後的半徑。偏移 1 µm 損耗很小，3 µm 時急增——耦合對偏移是非線性的；模場越小容差越緊，所以不同 FAU／耦合器的容差不同。假設（C 級）：兩端為理想高斯模場、間隙為空氣 n = 1（主動對準時；固化後的折射率匹配膠會改變結果）、無角度傾斜、無端面反射、固有損耗每面 0.5 dB。適用：偏移數 µm、間隙數十 µm 內的邊緣耦合；不適用：光柵耦合器（垂直入射、角度與波長敏感）、多模光纖、透鏡光纖。'},

n:'溫度模型只有一條路徑：T_ring = T_env + R_th × P_h；λ_res = λ_res(75 °C) + κ_T × (T_ring − 75 °C)。κ_T = 75 pm/K（矽微環文獻：模擬 68.2、實驗 77 pm/K，見 docs）；R_th = 2.5 K/mW → 加熱效率 ≈ 0.19 nm/mW；FWHM = 0.26 nm（Q ≈ 5000）；調變擺幅 80 pm（以上 C 級教學假設）。溫度升高 → 共振紅移（往長波長）。加熱器只能加熱，所以設計上讓「冷態」共振位在雷射短波長側，再用加熱器往上拉；環境超過約 75 °C 就拉不回來。最佳工作點在共振斜坡上、而非正中心：在中心或遠離共振時亮暗差都變小——遠離共振時光幾乎全部通過，但資料寫不進去。不含：自熱雙穩態、多個共振峰（FSR）切換、TEC 冷卻、元件差異。此為本課教學案例，不代表所有 CPO（也有 MZM 方案）。'},

n:'One temperature path only: T_ring = T_env + R_th × P_h; λ_res = λ_res(75 °C) + κ_T × (T_ring − 75 °C). κ_T = 75 pm/K (silicon microring literature: 68.2 simulated, 77 pm/K measured — see docs); R_th = 2.5 K/mW → ≈ 0.19 nm/mW; FWHM = 0.26 nm (Q ≈ 5000); modulation swing 80 pm (all class C teaching assumptions). Hotter → resonance red-shifts. A heater can only heat, so the “cold” resonance is designed to sit on the short-wavelength side of the laser and is pulled up by heating; above ≈ 75 °C ambient it cannot be pulled back. The best operating point is on the resonance slope, not its center: at the center or far away the bright/dim difference shrinks — far off resonance almost all light passes but no data is written. Excludes self-heating bistability, FSR hopping, TEC cooling, device variation. A teaching case for this course, not every CPO (some use MZMs).'},

  sv:'每條通道 = 1 個 EIC 驅動 ＋ 1 個 MRM ＋ 1 條單模光纖（並行單模、DR 型教學案例）。#1 = 「光學調校」正在調的代表通道，其餘通道假設與它相同。',
  n:'總容量不是單一波長的速率：1.6T 是 8 條 200G 通道「並排」相加。同一容量可以有不同配置（8×100G、4×200G 都是 800G）：通道越少、每通道越快 → 符號率與 f_N 越高 → 電氣損耗與接收雜訊頻寬增加；通道越多 → 需要的微環、光纖、雷射光越多。線路速率略高於有效速率，多出的是 FEC 等編碼開銷（以 IEEE 100G／200G 通道的 106.25／212.5 Gb/s 為例；400G 的 425 Gb/s 為 C 級推估）。光學損耗是「每條通道」的量：容量加倍不會讓每條通道的光學損耗加倍。3D 只畫 4 個微環作為示意，不代表實際通道數。'},

  tot:'雷射 → 接收端 光學損耗合計',eta:'FAU 單面耦合效率 η（輸入、輸出兩面各計一次）',las:'N 條通道的雷射光合計（光功率）',
  el:'電氣互連損耗（ASIC → EIC，@ f_N）',elN:'電氣 dB 影響的是 SerDes 等化與功耗，不能和上面的光學 dB 相加，所以獨立列出。',
  n:'單位：光功率用 mW 或 dBm（dBm = 10·log₁₀(P ÷ 1 mW)）；損耗用 dB（逐段相減）；耦合效率用 %（η = 10^(−dB/10)）。前五行直接沿用「光學調校」同一個模型的結果（每項只算一次；FAU 有輸入、輸出兩個耦合面，所以列兩行），再加上本頁的光纖與連接器。接收功率是平均功率；沒有經驗證的接收靈敏度，所以不顯示絕對鏈路餘裕。光纖長度示例在「傳輸配置」或「④ 延遲」切換。'},

  it:['ASIC SerDes 介面（隨 L 與 f_N）','EIC 驅動器','雷射電輸入（ELS，封裝外）','MRM 加熱器（熱調諧）'],
  tot:'合計功耗（上述範圍）',pj:'能耗效率',pjN:'pJ/bit = 合計功耗 ÷ 有效資料速率 {c}（1 W ÷ 1 Tb/s = 1 pJ/bit）',lo:'雷射光輸出合計（光功率）',le:'雷射電輸入合計（耗電）',
  n:'公式：SerDes = (2.0 + 0.12 × 電損耗 dB) pJ/bit × 線路速率〔C，沿用 M2 模型〕；EIC 驅動 = 0.8 pJ/bit × 線路速率〔C〕；雷射電輸入 = N × P_L ÷ 15 %（電光轉換效率，含驅動與溫控）〔C〕；加熱器 = N × P_h（「光學調校」的加熱器功率，假設每通道相同）〔模型〕。係數都是教學假設，不是產品實測。雷射光輸出 ≠ 雷射耗電：10 mW 的光約需 67 mW 的電。容量加倍時，與「每 bit」相關的功耗（SerDes、驅動）大致加倍，與「每通道」相關的（雷射、加熱器）隨通道數變化，所以 pJ/bit 不一定改變。NVIDIA 曾公布 CPO 每 1.6T 埠約 9 W、可插拔約 30 W（廠商宣稱，比較條件由廠商定義）；本頁計算範圍不同，不能直接對照，也不代表 CPO 在所有情境都省固定比例。三種架構的正式比較在 M7。'},
 lat:{h:'④ 延遲：時間花在哪裡',fl:'光纖長度示例（教學選定，同時用於損耗）',ph:'傳播延遲（和距離有關，和速率無關）',sh:'序列化時間（和速率有關，和距離無關）',
  it:['封裝內電走線 L × 6.5 ps/mm〔B〕','光纖傳播 {m} m × 4.9 ns/m〔B〕','電光／光電轉換與電路處理（EIC、MRM、PD、TIA）'],ne:'未估算',sum:'傳播延遲合計（電走線＋光纖）',
  se:['每通道 1 bit 時間 = 1 ÷ 線路速率','每通道 1 個 PAM4 符號時間','1500 B 封包，N 條通道並行送','同一封包只用 1 條通道送'],log:'長條為對數刻度：每格 ×10（1 ps → 10 µs）',
  n:'傳播延遲 = 距離 ÷ 訊號速度：封裝內走線每 mm 約 6.5 ps，把 L 從 2 拉到 30 mm 只多約 0.18 ns；光纖每公尺約 4.9 ns（n ≈ 1.47），100 m 就是 0.49 µs。序列化時間 = 資料量 ÷ 速率：速率越高，送完一個封包越快，但光走完光纖的時間不變。1 bit 時間、總容量、端到端延遲是三個不同的量，不能互換。電光／光電轉換與類比電路沒有可靠數據，本頁不估算；鏈路若含 DSP、FEC 解碼或交換處理，還會有額外延遲（也不估算）。'},
 eye:{h:'⑤ 訊號品質 · 教育級眼圖',tag:'教育示意，非實際量測',idx:'眼高指數（預設 1.6T 狀態 = 100 %）',q:'品質分級（C 級門檻）',sw:'接收端亮／暗功率差（相對預設）',ns:'接收雜訊 σ（相對 200G 通道，∝ √符號率）',
  hi:'亮',lo:'暗',op:'眼高',cl:'眼睛閉合',z:'0 mW',
  dr:'相對預設的影響（dB，加總 = 亮暗差變化）：FAU {a} · MRM 工作點 {b} · 雷射功率 {c} · 光纖長度 {d}；另外雜訊 σ 變為 {e}（由每通道速率決定）。',
  n:'畫法：接收端「亮」「暗」兩種位元的平均光功率（由 FAU、MRM、雷射、光纖同一條模型算出）當作上下兩條軌跡，再疊上固定的接收雜訊帶（±3σ）。眼高指數 = (亮暗差 − 6σ) ÷ 預設狀態的同一值。假設：接收端以熱雜訊為主、雜訊 ∝ √符號率（B 級公式，C 級參數 σ = 3.5 % 預設亮暗差），所以每通道越快雜訊帶越粗；以兩階（亮／暗）簡化表示，實際 PAM4 有四階、三個眼。分級：≥ 60 % 良好、20–60 % 普通、< 20 % 不佳（C）。沒有頻寬、抖動、接收器與等化模型，所以不計算 BER、Q 值或 OMA 量測值——這張圖只代表趨勢。這裡是「整條鏈路」的品質，和「光學調校」中只看 MRM 的調變品質是不同指標。'}};

 how:'Every number here comes from one parameter set: capacity and lanes in “Transmission”, the FAU / MRM / laser in “Optics tuning”, and trace length L in “Package link”. Change any of them and the five tiles above, these details and the schematic update together.',
 cap:{h:'① Lane architecture: where capacity comes from',f:'Total capacity = lane count N × per-lane effective rate',
  m:['Total capacity (payload, one engine)','Lane count N [teaching case]','Per-lane effective data rate','Per-lane line rate (incl. FEC/coding overhead)','Per-lane symbol rate (PAM4: 2 bit/symbol)','Nyquist frequency f_N (electrical loss evaluated here)','Sum of N lane line rates'],
  sv:'Each lane = 1 EIC driver + 1 MRM + 1 single-mode fiber (parallel SMF, DR-style teaching case). #1 = the representative lane tuned in “Optics tuning”; the others are assumed identical.',
  n:'Total capacity is not the rate of one wavelength: 1.6T is eight 200G lanes side by side. One capacity can have different configs (8×100G and 4×200G are both 800G): fewer, faster lanes → higher symbol rate and f_N → more electrical loss and receiver noise bandwidth; more lanes → more rings, fibers and laser light. The line rate is a little above the payload rate; the extra is FEC/coding overhead (IEEE 100G/200G lanes run 106.25 / 212.5 Gb/s; 425 Gb/s for 400G is a class-C estimate). Optical loss is a per-lane quantity: doubling capacity does not double each lane’s optical loss. The 3D view shows only 4 rings symbolically, not the real lane count.'},
 loss:{h:'② Optical power & loss (per lane)',from:'Laser output',rx:'RX mean',col:['Stage','','Loss','Power after'],
  fib:'Fiber {m} m × 0.4 dB/km [A/B]',con:'2 fiber connectors × 0.5 dB [C]',
  tot:'Total optical loss, laser → receiver',eta:'FAU per-facet coupling η (input and output facets each counted once)',las:'Laser light summed over N lanes (optical)',
  el:'Electrical interconnect loss (ASIC → EIC, @ f_N)',elN:'Electrical dB drives SerDes equalization and power; it must not be added to the optical dB above, so it is listed separately.',
  n:'Units: optical power in mW or dBm (dBm = 10·log₁₀(P ÷ 1 mW)); loss in dB (subtracted stage by stage); coupling efficiency in % (η = 10^(−dB/10)). The first five rows reuse the same “Optics tuning” model (each counted once; the FAU has an input and an output facet, hence two rows), then this page adds fiber and connectors. Received power is the mean power; with no validated receiver sensitivity, no absolute link margin is shown. Change the example fiber length under “Transmission” or “④ Latency”.'},
 pwr:{h:'③ Power & energy efficiency',scope:'Scope: the transmit direction of one optical engine (N lanes) + the matching ASIC SerDes interface + the external laser feeding it. Excludes: ASIC switching core, rest of the switch, far-end receiver, fans and power conversion.',
  it:['ASIC SerDes interface (depends on L and f_N)','EIC driver','Laser electrical input (ELS, off-package)','MRM heater (thermal tuning)'],
  tot:'Total power (scope above)',pj:'Energy efficiency',pjN:'pJ/bit = total power ÷ payload rate {c} (1 W ÷ 1 Tb/s = 1 pJ/bit)',lo:'Total laser optical output',le:'Total laser electrical input',
  n:'Formulas: SerDes = (2.0 + 0.12 × electrical loss dB) pJ/bit × line rate [C, M2 model]; EIC driver = 0.8 pJ/bit × line rate [C]; laser electrical = N × P_L ÷ 15 % (wall-plug efficiency incl. drive and temperature control) [C]; heater = N × P_h (the Optics-lab heater power, assumed equal per lane) [model]. All coefficients are teaching assumptions, not product measurements. Laser optical output ≠ laser power draw: 10 mW of light needs ≈ 67 mW of electricity. Doubling capacity roughly doubles per-bit costs (SerDes, driver), while per-lane costs (laser, heater) follow lane count, so pJ/bit need not change. NVIDIA has announced ≈ 9 W per 1.6T port for CPO vs ≈ 30 W pluggable (vendor claim, vendor-defined conditions); this page uses a different scope, so the numbers cannot be compared directly, and CPO does not save a fixed percentage in every scenario. A formal three-architecture comparison comes in M7.'},
 lat:{h:'④ Latency: where the time goes',fl:'Example fiber length (teaching choice, also used for loss)',ph:'Propagation delay (depends on distance, not rate)',sh:'Serialization time (depends on rate, not distance)',
  it:['In-package trace L × 6.5 ps/mm [B]','Fiber {m} m × 4.9 ns/m [B]','E/O, O/E conversion & circuits (EIC, MRM, PD, TIA)'],ne:'not estimated',sum:'Total propagation (trace + fiber)',
  se:['1 bit time per lane = 1 ÷ line rate','1 PAM4 symbol per lane','1500 B packet over N lanes in parallel','same packet on a single lane'],log:'Bars use a log scale: ×10 per step (1 ps → 10 µs)',
  n:'Propagation delay = distance ÷ signal speed: an in-package trace costs ≈ 6.5 ps per mm, so moving L from 2 to 30 mm adds only ≈ 0.18 ns; fiber costs ≈ 4.9 ns per meter (n ≈ 1.47), so 100 m is 0.49 µs. Serialization time = data size ÷ rate: a faster link finishes sending a packet sooner, but light still takes the same time to cross the fiber. Bit time, total capacity and end-to-end latency are three different quantities. No reliable data exist here for E/O, O/E conversion and analog circuits, so they are not estimated; DSP, FEC decoding or switching would add more delay (also not estimated).'},
 eye:{h:'⑤ Signal quality · educational eye diagram',tag:'Educational illustration, not a measurement',idx:'Eye-height index (default 1.6T state = 100 %)',q:'Quality grade (class-C thresholds)',sw:'RX bright/dim power difference (vs default)',ns:'Receiver noise σ (vs 200G lane, ∝ √symbol rate)',
  hi:'bright',lo:'dim',op:'eye height',cl:'eye closed',z:'0 mW',
  dr:'Changes vs default (dB; they add up to the bright/dim change): FAU {a} · MRM operating point {b} · laser power {c} · fiber length {d}; noise σ is now {e} (set by per-lane rate).',
  n:'How it is drawn: the mean received powers of “bright” and “dim” bits (from the same FAU, MRM, laser and fiber model) form the upper and lower traces, overlaid with a fixed receiver-noise band (±3σ). Eye-height index = (bright − dim − 6σ) ÷ the same value in the default state. Assumptions: thermal-noise-limited receiver with noise ∝ √symbol rate (class-B formula, class-C parameter σ = 3.5 % of the default bright/dim difference), so faster lanes get a thicker noise band; shown as two levels (bright/dim) for simplicity — real PAM4 has four levels and three eyes. Grades: ≥ 60 % good, 20–60 % fair, < 20 % poor (C). Without bandwidth, jitter, receiver and equalizer models, no BER, Q-factor or measured OMA is computed — the plot shows trends only. This is whole-link quality, a different metric from the MRM-only modulation quality in “Optics tuning”.'}};

 return '<div class="eyw" id="pey"></div>'+mt(p.eye.idx,'pe0')+mt(p.eye.q,'pe1')+mt(p.eye.sw,'pe2')+mt(p.eye.ns,'pe3')+'<p class="xs2" id="pdr"></p><p class="xs2">'+p.eye.n+'</p>'}
/* 通道示意：N 條「EIC → MRM → 光纖」；微環顏色＝代表通道的調變對比（與 3D 同一映射），光纖亮度＝光纖平均功率（與 3D 粒子同一映射） */
function laneSVG(r,o){const n=r.n,gp=n>8?6:n>4?9:12,y0=16,h=y0+n*gp+16,rc='#'+new T.Color(0x7d8590).lerp(new T.Color(0x8ff0dc),Math.min(1,Math.max(0,o.cRel))).getHexString(),op=pv(o.PfdBm).toFixed(2);let s='';
 for(let i=0;i<n;i++){const y=(y0+gp*(i+.5)).toFixed(1);s+='<line x1="62" y1="'+y+'" x2="152" y2="'+y+'" class="la e"/><circle cx="160" cy="'+y+'" r="'+Math.min(4,gp*.38).toFixed(1)+'" style="fill:none;stroke:'+rc+';stroke-width:1.6"/><line x1="168" y1="'+y+'" x2="250" y2="'+y+'" class="la m" style="stroke-opacity:'+op+'"/>'+(i==0?'<text class="tk" x="254" y="'+(+y+3)+'">#1</text>':'')}
 return '<svg class="xv ln'+(state.running?' run':'')+'" viewBox="0 0 300 '+h+'"><rect x="6" y="'+y0+'" width="52" height="'+n*gp+'" rx="5" style="fill:#17181c"/><text x="32" y="'+(y0+n*gp/2-1)+'" text-anchor="middle" style="fill:#fff;font-weight:700">ASIC</text><text x="32" y="'+(y0+n*gp/2+9)+'" text-anchor="middle" style="fill:#bbb">SerDes</text>'
  +'<text x="107" y="11" text-anchor="middle">EIC · '+r.g+'G</text><text x="160" y="11" text-anchor="middle">MRM</text><text x="209" y="11" text-anchor="middle">SMF</text>'+s+'<text class="tk" x="292" y="'+(h-4)+'" text-anchor="end">'+n+' × '+r.g+'G = '+capS(r.cap)+'</text></svg>'}
/* 教育級眼圖（兩階簡化）：上下軌跡 = 接收端亮／暗位元平均功率（PERF），雜訊帶 ±3σ（σ ∝ √符號率）；固定亂數種子 → 同參數同圖。非量測 */
function eyeSVG(r,x){const sw0=OptiKit.cpoPerf.sw0,lo=r.Prxd/sw0,hi=r.Prxb/sw0,sg=r.sig,top=Math.max(1.9,hi+4*sg),X=u=>20+u*125,Y=v=>116-v/top*100;let sd=7;
 const rn=()=>(sd=sd*16807%2147483647)/2147483647,gs=()=>Math.sqrt(-2*Math.log(rn()+1e-9))*Math.cos(2*Math.PI*rn());let tr='';
 for(let k=0;k<24;k++){const b=[k&1,(k>>1)&1,(k>>2)&1],nz=[gs(),gs(),gs()].map(v=>v*sg),lv=i=>(b[i]?hi:lo)+nz[i],
   v=u=>{for(const c of [.5,1.5]){const dd=u-c;if(Math.abs(dd)<.25){const ff=(1-Math.cos(Math.PI*(dd+.25)/.5))/2,i0=c<1?0:1;return lv(i0)*(1-ff)+lv(i0+1)*ff}}return lv(u<.5?0:u<1.5?1:2)};
  let p='';for(let j=0;j<=40;j++){const u=j/20;p+=(j?'L':'M')+X(u).toFixed(1)+','+Y(Math.max(0,v(u))).toFixed(1)}tr+='<path class="tr" d="'+p+'"/>'}
 const ot=hi-3*sg,ob=lo+3*sg,open=ot>ob,xc=X(1),qc=r.q=='good'?'#2e9d6a':r.q=='warn'?'#d08a1a':'#d9534f';
 return '<svg class="xv ey" viewBox="0 0 300 132"><line x1="20" y1="'+Y(0)+'" x2="270" y2="'+Y(0)+'" style="stroke:var(--line)"/><text x="16" y="'+(Y(0)+3)+'" text-anchor="end">0</text>'
  +'<rect class="swp" x="20" y="14" width="6" height="102"/>'+tr
  +'<line x1="20" y1="'+Y(hi).toFixed(1)+'" x2="270" y2="'+Y(hi).toFixed(1)+'" style="stroke:var(--mut);stroke-dasharray:2 3"/><line x1="20" y1="'+Y(lo).toFixed(1)+'" x2="270" y2="'+Y(lo).toFixed(1)+'" style="stroke:var(--mut);stroke-dasharray:2 3"/>'
  +'<text x="274" y="'+(Y(hi)+3).toFixed(1)+'">'+x.hi+'</text><text x="274" y="'+(Y(lo)+3).toFixed(1)+'">'+x.lo+'</text>'
  +(open?'<rect x="'+(xc-14)+'" y="'+Y(ot).toFixed(1)+'" width="28" height="'+(Y(ob)-Y(ot)).toFixed(1)+'" style="fill:'+qc+';fill-opacity:.18;stroke:'+qc+';stroke-width:1.4"/><text class="tk" x="'+(xc+18)+'" y="'+((Y(ot)+Y(ob))/2+3).toFixed(1)+'">'+x.op+'</text>'
   :'<text class="tk" x="'+xc+'" y="'+(Y((hi+lo)/2)+3).toFixed(1)+'" text-anchor="middle" style="fill:#d9534f">✕ '+x.cl+'</text>')
  +'<text class="tk" x="292" y="11" text-anchor="end">'+x.tag+'</text><text x="20" y="128">−0.5 UI</text><text x="'+xc+'" y="128" text-anchor="middle">0</text><text x="270" y="128" text-anchor="end">+0.5 UI</text></svg>'}
/* 即時更新（每次 optSet 都呼叫）：只改數字與小圖，不重建控制組，所以拖曳滑桿不中斷。各區塊存在才更新（看板一定存在；細節、比較表依目前畫面） */
function perfPanel(){const r=PERF,o=OPT,d=D[L],p=d.p,u=d.ui,t=(id,v)=>{const e=$('#'+id);if(e)e.textContent=v},qn=p.qs[r.q],cq='q-'+r.q,EHp=f1(Math.max(0,r.EH)*100,0);
 /* 看板五格：數值改變時短暫以橘色閃一下，讓使用者看出「哪一項變了、哪一項沒變」 */
 const sv=(id,v)=>{const e=$('#'+id);if(!e)return null;if(e.textContent!==v){const had=e.textContent!=='';e.textContent=v;if(had&&e.tagName=='B'){e.classList.remove('chg');void e.offsetWidth;e.classList.add('chg')}}return e},
  bar=(id,f,c)=>{const e=$('#'+id);if(e){e.style.width=(Math.max(0,Math.min(1,f))*100).toFixed(1)+'%';e.className=c||''}};
 if($('#k_cap')){const lt=r.lat.el+r.lat.fib;
  sv('k_cap',capS(r.cap)+(r.front?' *':''));sv('ks_cap',fmt(u.ks.cap,{n:r.n,g:r.g}));bar('kb_cap',r.cap/3200);
  sv('k_loss',f1(r.lossTot)+' dB');sv('ks_loss',fmt(u.ks.loss,{r:f1(r.PrxdBm),e:f1(r.el.il)}));bar('kb_loss',r.lossTot/20);
  sv('k_pwr',Wt(r.tot));sv('ks_pwr',fmt(u.ks.pwr,{p:f1(r.pJ,2)}));bar('kb_pwr',r.tot/20);
  sv('k_lat',tS(lt));sv('ks_lat',fmt(u.ks.lat,{m:r.fm,e:tS(r.lat.el)}));bar('kb_lat',Math.log10(Math.max(lt,1))/7);
  const ke=sv('k_eye',qn+' · '+EHp+' %');ke.classList.remove('q-good','q-warn','q-bad');ke.classList.add(cq);sv('ks_eye',fmt(u.ks.eye,{s:f1(r.sig/OptiKit.cpoPerf.K.sig0*100,0)}));bar('kb_eye',r.EH,cq);
  t('dst',(r.front?'* '+p.front+' · ':'')+(state.running?u.dOn:u.dOff))}
 t('kcf',(r.front?'* '+p.front+' · ':'')+p.cfgT[r.rate][r.ci]);
 if($('#cmp'))cmpUI();
 /* ① 通道 */
 if($('#pln')){$('#pln').innerHTML=laneSVG(r,o);[capS(r.cap),r.n,r.g+' Gb/s',f1(r.line1,2)+' Gb/s',f1(r.baud,3)+' GBd',fq(r.fN)+' GHz',f1(r.line,1)+' Gb/s'].forEach((v,i)=>t('pc'+i,v))}
 /* ② 損耗：前五行 = OPT.loss（光學調校同一模型），後兩行 = 光纖＋連接器 */
 if($('#pwf')){const lb=d.x.wf.concat([fmt(p.loss.fib,{m:r.fm}),p.loss.con]),mx=Math.max(8,...r.loss);
  $('#pwf').innerHTML='<div class="hd"><span>'+p.loss.col[0]+'</span><span></span><b>'+p.loss.col[2]+'</b><b>'+p.loss.col[3]+'</b></div>'+r.loss.map((v,i)=>'<div><span>'+lb[i]+'</span><i class="'+((i==1||i==4)&&o.fauDB>1||i==3&&o.q!='good'?'hot':'')+'" style="width:'+Math.min(100,v/mx*100).toFixed(0)+'%"></i><b>−'+f1(v,2)+' dB</b><b>'+f1(10*Math.log10(r.after[i]),1)+' dBm</b></div>').join('');
  t('pfrom',p.loss.from+' '+f1(o.PL)+' mW ('+f1(o.PLdBm)+' dBm)');t('pto','→ '+p.loss.rx+' '+f1(r.Prx,2)+' mW ('+f1(r.PrxdBm)+' dBm)');
  t('pl0','−'+f1(r.lossTot,2)+' dB');t('pl1',f1(o.eta*100)+' % (−'+f1(o.facetDB,2)+' dB)');t('pl2',f1(r.laserTot,0)+' mW = '+r.n+' × '+f1(o.PL)+' mW');t('pl3',f1(r.el.il,2)+' dB @ '+fq(r.fN)+' GHz')}
 /* ③ 功耗 */
 if($('#pst')){const ks=['ser','drv','las','heat'];$('#pst').innerHTML=ks.map(k=>'<i class="c-'+k+'" style="width:'+(r.pw[k]/r.tot*100).toFixed(2)+'%"></i>').join('');
  $('#ppl').innerHTML=ks.map((k,i)=>'<div><i class="c-'+k+'"></i><span>'+p.pwr.it[i]+'</span><b>'+Wt(r.pw[k])+'</b><b>'+f1(r.pw[k]/r.tot*100,0)+' %</b></div>').join('');
  t('pp0',Wt(r.tot));t('pp1',f1(r.pJ,2)+' pJ/bit');t('ppj',fmt(p.pwr.pjN,{c:capS(r.cap)}));t('pp2',Wt(r.laserTot/1000));t('pp3',Wt(r.pw.las))}
 /* ④ 延遲（ps；長條為對數刻度 1 ps → 10 µs） */
 if($('#plp')){const row=(lab,ps)=>'<div><span>'+lab+'</span>'+(ps==null?'<i class="na" style="width:100%"></i><b>'+p.lat.ne+'</b>':'<i style="width:'+Math.max(2,Math.min(100,Math.log10(Math.max(ps,1))/7*100)).toFixed(0)+'%"></i><b>'+tS(ps)+'</b>')+'</div>',lt=r.lat;
  $('#plp').innerHTML=row(p.lat.it[0],lt.el)+row(fmt(p.lat.it[1],{m:r.fm}),lt.fib)+row(p.lat.it[2],null);t('pt0',tS(lt.el+lt.fib));
  $('#pls').innerHTML=row(p.lat.se[0],lt.bit)+row(p.lat.se[1],lt.sym)+row(p.lat.se[2],lt.pktN)+row(p.lat.se[3],lt.pkt1)}
 /* ⑤ 眼圖 */
 if($('#pey')){const ey=$('#pey');ey.innerHTML=eyeSVG(r,p.eye);ey.classList.toggle('run',state.running);ey.classList.toggle('off',!state.running);
  t('pe0',EHp+' %');const q=$('#pe1');q.textContent=qn;q.className=cq;t('pe2',f1(r.s1*100,0)+' %');t('pe3',f1(r.sig/OptiKit.cpoPerf.K.sig0*100,0)+' %');
  const sz=(v,n)=>sg(Math.abs(v)<.5*Math.pow(10,-n)?0:v,n);/* 避免顯示 −0.0 */
  t('pdr',fmt(p.eye.dr,{a:sz(r.drv.fau,1),b:sz(r.drv.mrm,1),c:sz(r.drv.las,1),d:sz(r.drv.fib,2),e:f1(r.sig/OptiKit.cpoPerf.K.sig0*100,0)+' %'}))}}
/* 右側操作（看板、控制組切換、各控制組按鈕）：全部委派在 #panel 上。M5.5 已移除「點指標 → 跳到下方細節並捲動」的舊行為 */
$('#panel').addEventListener('click',e=>{const g=k=>e.target.closest('['+k+']');let b;
 if(b=g('data-sub')){const n=+b.dataset.sub;if(n!=SUB){SCR[SUB]=$('#pb').scrollTop;SUB=n;panel(SCR[SUB]||0)}return}/* 切換控制組：只換畫面，不動任何參數；各組記住自己的捲動位置 */
 if(g('data-dxc')){DX=null;dash();return}
 if(b=g('data-dx')){DX=DX==b.dataset.dx?null:b.dataset.dx;dash();return}/* 看板細節：在看板內原位展開／收合，不捲動 */
 /* 容量情境、通道配置、光纖長度示例：改 state → 看板、比較表、規格與概覽同步；panel() 保留目前捲動位置 */
 if(b=g('data-rate')){if(b.dataset.rate!=state.rate){optSet({rate:b.dataset.rate,lanes:0});syncSpec();panel();ovUI();refUI()}return}
 if(b=g('data-cfg')){optSet({lanes:+b.dataset.cfg});syncSpec();panel();ovUI();refUI();return}
 if(b=g('data-fm')){optSet({fiberM:+b.dataset.fm});panel();return}
 if(b=g('data-cpl')){optSet({cpl:b.dataset.cpl});panel();return}
 if(g('data-ht')){optSet({heatOn:!state.heatOn});panel();return}
 if(g('data-lock')){const r=OptiKit.cpoOptics.lock(state);optSet({heatOn:true,heatP:lockP(r)});LKM=r.why;panel();return}
 if(b=g('data-xr')){const k=b.dataset.xr,p={};(k=='all'?['fau','mrm','las']:[k]).forEach(n=>Object.assign(p,XDEF[n]));if(k=='all')p.cpl='ssc';
  optSet(p);if(k=='mrm'||k=='all')optSet({heatP:lockP(OptiKit.cpoOptics.lock(state))});/* 雷射重設不動加熱器：保留「波長改變 → 需重新調諧」的連動 */
  panel();return}});

$('#pb').oninput=e=>{if(e.target.id=='ds'){optSet({dist:+e.target.value});dist()}/* M4-C：距離也經 optSet → PERF（SerDes 功耗、延遲）同步 */if(XI[e.target.id])optSet({[XI[e.target.id]]:+e.target.value})};

 tb.forEach((b,i)=>b.title=d.tb[i]);document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));
 $('#pill').textContent=d.crs;$('#scb .tx').textContent=d.scB;$('#rfs .tx').textContent=u.sec;$('#rfp .tx').textContent=u.spec;

const zh2=()=>L=='zh'?'zh-Hant':'en';
/* ---------- 動畫迴圈 ---------- */
const t0=performance.now();
function loop(now){requestAnimationFrame(loop);const t=(now-t0)/1000;
 if(AUTO){th+=.004;EX=.5+.45*Math.sin(t*.6);$('#exr').value=EX*100;$('#exv').textContent=Math.round(EX*100)+'%'}
 upd();cam();vOff();const PW=state.running;
 if(PW){const s=Math.max(0,Math.floor((now-RT0)/1000/DUR)%NST);/* M7-A：按下運行的同一幀 now 可能略早於 RT0，避免步驟算成 −1（待決 #31） */if(s!==state.stage){state.stage=s;stageUI()}glow(t)}
 /* M4-B：雷射 LED 亮度 ∝ 雷射功率（dBm 示意）；青色 CW 粒子 ∝ 進入 FAU 前的功率；紫色亮/暗粒子 ∝ 光纖中亮/暗位元功率（FAU 偏移、MRM 失諧都會讓它變暗或亮暗差消失） */
 const V=OPT.vis;LED.emissive.setHex(PW?0x3ee0c0:0x0a2a24);if(PW)LED.emissive.multiplyScalar(V.led);CWM.opacity=V.cw;MM1.opacity=V.hi;MM0.opacity=V.lo;

 PS.forEach(p=>{const on=PW&&f&&CV[p.c];p.m.visible=!!on;if(on){p.m.position.copy(CV[p.c].getPoint((t*.12+p.k/8)%1));if(p.c%2){const b=bits[p.k];p.m.material=b?MM1:MM0;p.m.scale.setScalar(.45+.75*(b?V.hi:V.lo/.6))}}});
 const ow=off(REG.wg[0],'wg'),of=off(REG.fibers[0],'fibers'),xv=f&&VIS.wg!==false;
 XM.forEach(m=>{m.sp.visible=m.fp.visible=m.ln.visible=xv;if(!xv)return;m.sp.position.set(m.s*(4.51+LAY.dx),1.5+ow,0);m.fp.position.set(m.s*(4.47+LAY.dx+FV.gx),1.5+of+FV.y,FV.z);
  const a=m.ln.geometry.attributes.position;a.setXYZ(0,m.sp.position.x,m.sp.position.y,m.sp.position.z);a.setXYZ(1,m.fp.position.x,m.fp.position.y,m.fp.position.z);a.needsUpdate=true;m.ln.geometry.computeBoundingSphere()});
 EP.forEach(p=>{p.m.visible=ev;if(ev){const key=p.s+'|'+p.z,pts=LN[key]||(LN[key]=lane(p.s,p.z)),b=bits[p.k];along(pts,(t*.12+p.k/8)%1,p.m.position);p.m.material=b?EM1:EM0;p.m.scale.setScalar(b?1:.6)}});
