<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHIP PACKAGING · 課程 1 · 傳統可插拔光模組</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../core/core.css">
<link rel="stylesheet" href="../core/viewer.css">
<style>
/* 可插拔課專用（M6）：面板頂端固定的插拔／通道狀態看板、3D 插拔卡、原理圖斷線樣式。只在本頁使用，不放進 core/。 */
#dash{flex:none;border-bottom:1px solid var(--line);padding:10px 12px 8px;background:var(--card)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.dc{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 9px;min-width:0}
.dc small{display:block;font-size:10.5px;font-weight:700;color:var(--mut)}.dc b{display:block;font-size:12.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dc span{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr{display:flex;align-items:center;gap:8px;margin-top:7px}.dr .pwb{white-space:nowrap;flex:none}.dr .ev{font-size:11px;color:var(--ink);font-weight:700;line-height:1.35;min-width:0}
.pwb:disabled{opacity:.6;cursor:wait}
#plugc{position:absolute;right:12px;top:36px;z-index:2;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:11px;min-width:168px}
#plugc .pwb{width:100%;margin-bottom:4px;font-size:12.5px}
#plugc div{display:flex;align-items:center;gap:5px;line-height:1.55}#plugc small{color:var(--mut);font-weight:700}#plugc b{margin-left:auto;font-weight:900;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.stl .st.cut{opacity:.45;border-style:dashed}
.lgd .kx{color:#d9534f;font-style:normal;font-weight:900}
#sch.cut .mz{opacity:.16}
#sch .xx{display:none}#sch.cut .xx{display:inline}.xx path{stroke:#d9534f;stroke-width:5;stroke-linecap:round}
#sch.ini .xx path{stroke:#d08a1a}
.sv .cutt{font-size:14px;font-weight:900;fill:#d9534f}#sch.ini .sv .cutt{fill:#d08a1a}
@media(min-width:901px) and (max-width:1180px){#ex{bottom:54px}#plugc{top:auto;bottom:100px}.pill{max-width:calc(100% - 24px)}#chip{top:76px!important}#runb{top:104px!important}}
@media(max-width:900px){#dash{position:sticky;top:0;z-index:4}}
@media(max-width:600px){#plugc{top:auto;bottom:100px;min-width:0;padding:5px 8px}#plugc div{display:none}#plugc div:last-child{display:flex}.pill{max-width:calc(100% - 24px)}#chip{top:76px!important}#runb{top:104px!important}}
</style>
</head>
<body>
<!-- 課程 1：傳統可插拔光模組（M6）。版面與 NPO 課相同；3D 模型、物理、文字皆為 800G OSFP 代表案例獨立建模，見 courses/pluggable/*.js -->
<div id="app" class="okgrid">
<header>
 <div class="logo"><div class="lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1.5"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></div><div><h1>CHIP PACKAGING <b>入門</b></h1><div class="sub" id="sb"></div></div></div>
 <div class="hr"><span class="badge" id="bd"></span><div class="lang"><button data-l="zh">中</button><button data-l="en">EN</button></div></div>
</header>
<aside id="side"><div class="sh"><span id="st1"></span><button class="tg" id="tg" title="收合 / Collapse">‹</button></div><div class="sl" id="sl"></div></aside>
<main id="vp"><canvas id="cv"></canvas><div id="labs"></div><div class="pill" id="pill"></div><div class="chip" id="chip" style="top:62px"></div><div class="hint" id="hint"></div><div id="runb" hidden style="top:92px"></div>
 <div id="plugc"></div>
 <div id="sch" hidden></div>
 <div id="ex"><div><span id="exl"></span><b id="exv">40%</b></div><input type="range" id="exr" min="0" max="100" value="40"></div>
 <div id="tb"><button>↺</button><button>+</button><button>−</button><button id="au">▶</button><button class="on"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8.5V2h6.5L14 7.5 7.5 14z"/><circle cx="5" cy="5" r="1"/></svg></button><button id="scb" class="wide"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="2" width="5" height="4" rx="1"/><rect x="10" y="10" width="5" height="4" rx="1"/><path d="M6 4h3.5v8H10"/></svg><span class="tx"></span></button></div></main>
<section id="panel"><div id="dash"></div><div class="tabs" id="tabs"></div><div id="pb"></div></section>
<nav id="course"></nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../core/ui.js"></script>
<script src="../core/viewer.js"></script>
<script src="pluggable/plug-physics.js"></script>
<script src="pluggable/plug-content.js"></script>
<script src="pluggable/plug-app.js"></script>
</body>
</html>
